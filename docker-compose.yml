version: '3.8'

services:
  scanner-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-scanner-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SCANNER_SECRET_KEY=change-in-production-to-a-random-32-char-key
      - SCANNER_ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=sqlite:////data/security_scanner.db
      - SCANNER_TIMEOUT_SECONDS=4.0
      - SCANNER_RATE_LIMIT_RPS=10.0
    volumes:
      - scanner-data:/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  scanner-data:
    driver: local
